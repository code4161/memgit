[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memgit"
version = "0.13.0"
description = "Git for AI memory — version-controlled context persistence across Claude, GPT, Gemini, Cursor, Windsurf, and more"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "ai", "memory", "mcp", "claude", "cursor", "windsurf", "llm",
    "context", "version-control", "agent", "chatgpt", "gemini"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    # BOTH BOUNDS ARE LOAD-BEARING.
    #
    # Upper (added 2026-09-06): the MCP SDK released 2.0.0 on 2026-07-28 and
    # removed `Server.list_tools` / `Server.call_tool`, so an unbounded
    # `mcp>=1.0.0` resolved to 2.1.1 and every fresh install crashed on startup
    # with AttributeError before serving a single request. Both install routes
    # were affected: pip directly, and the npm wrapper, which runs
    # `pip install --upgrade memgit` into a clean venv. Raise this bound only
    # together with a server that works on the new API.
    #
    # Lower (raised 2026-09-11 from >=1.0.0): 1.28.1 is the first 1.x release
    # clear of every published advisory against the SDK. There are SIX, not the
    # five a marketplace scan reported -- CVE-2025-53366 (<1.9.4),
    # CVE-2025-53365 (<1.10.0), CVE-2025-66416 (<1.23.0), CVE-2026-52869
    # (<=1.27.1), CVE-2026-52870 (>=1.23.0,<=1.27.1) and CVE-2026-59950
    # (<1.28.1). Five are in the SDK's HTTP / SSE / WebSocket server transports
    # and the sixth needs `server.experimental.enable_tasks()`; memgit imports
    # only `mcp.server.Server` and `mcp.types`, speaks stdio, and calls none of
    # them, so none were reachable in this package. The range is still what a
    # resolver is allowed to pick and what a supply-chain scanner reads, so it
    # states the floor. Re-check the advisory list before lowering this.
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-anyio>=0.0.0"]
tokens = ["tiktoken>=0.7"]
cloud = ["pynacl>=1.5", "httpx>=0.27"]

[project.urls]
Homepage = "https://memgit.dev"
Repository = "https://github.com/code4161/memgit"
Documentation = "https://memgit.dev/docs"
"Bug Tracker" = "https://github.com/code4161/memgit/issues"

[project.scripts]
memgit = "memgit.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["memgit*"]

[tool.setuptools.package-data]
memgit = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
