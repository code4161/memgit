[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memgit"
version = "0.10.0"
description = "Git for AI memory — version-controlled context persistence across Claude, GPT, Gemini, Cursor, Windsurf, and more"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "ai", "memory", "mcp", "claude", "cursor", "windsurf", "llm",
    "context", "version-control", "agent", "chatgpt", "gemini"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    # UPPER BOUND IS LOAD-BEARING, added 2026-09-06. The MCP SDK released 2.0.0
    # on 2026-07-28 and removed `Server.list_tools` / `Server.call_tool`, so an
    # unbounded `mcp>=1.0.0` resolved to 2.1.1 and every fresh install crashed
    # on startup with AttributeError before serving a single request. Both
    # install routes were affected: pip directly, and the npm wrapper, which
    # runs `pip install --upgrade memgit` into a clean venv. Raise this bound
    # only together with a server that works on the new API.
    "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-anyio>=0.0.0"]
tokens = ["tiktoken>=0.7"]
cloud = ["pynacl>=1.5", "httpx>=0.27"]

[project.urls]
Homepage = "https://memgit.dev"
Repository = "https://github.com/code4161/memgit"
Documentation = "https://memgit.dev/docs"
"Bug Tracker" = "https://github.com/code4161/memgit/issues"

[project.scripts]
memgit = "memgit.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["memgit*"]

[tool.setuptools.package-data]
memgit = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
